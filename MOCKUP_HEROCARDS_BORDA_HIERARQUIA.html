<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Z Meta — Herocards escuros com borda por hierarquia (mockup)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{ --navy:#12203a; --navy2:#1c2e4d; --paper:#f0eee7; --muted:#7d7a6f; }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--paper);font-family:'Inter',system-ui,sans-serif;color:var(--navy);}
  .wrap{ max-width:1000px; margin:0 auto; padding:28px 20px 60px; }
  .intro{ font-size:13px; color:var(--muted); font-weight:600; margin-bottom:26px; line-height:1.5; }
  .intro b{ color:var(--navy); }
  .grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:20px; }

  .row{ background:#fff; border:1px solid #e7e3d9; border-radius:20px; padding:16px; }
  .row .who{ font-size:11px; text-transform:uppercase; letter-spacing:.06em; font-weight:800; color:var(--muted); margin-bottom:10px; }

  .hero{
    position:relative; overflow:hidden; border-radius:28px; padding:22px;
    background:linear-gradient(160deg, var(--navy2), var(--navy));
    border:2px solid var(--accent, #c9a15a);
    box-shadow:0 10px 26px rgba(18,32,58,.16);
    transition:border-color .2s;
  }
  .hero::after{
    content:""; position:absolute; right:-50px; top:-50px; width:180px; height:180px; border-radius:50%;
    background:radial-gradient(circle, color-mix(in srgb, var(--accent, #c9a15a) 30%, transparent), transparent 70%);
  }
  .hero .lbl{ font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; font-weight:800; color:var(--accent,#c9a15a); position:relative; }
  .hero .val{ font-size:26px; font-weight:900; color:#fff; margin:8px 0 3px; letter-spacing:-.02em; position:relative; }
  .hero .sub{ font-size:11.5px; color:#9aa3b5; font-weight:600; margin-bottom:14px; position:relative; }
  .track{ height:7px; border-radius:100px; background:rgba(255,255,255,.1); overflow:hidden; position:relative; }
  .fill{ height:100%; border-radius:100px; background:var(--accent,#c9a15a); width:var(--pct,60%); }
  .foot{ display:flex; justify-content:space-between; margin-top:8px; font-size:10.5px; color:#8b94a6; font-weight:600; position:relative; }
  .foot b{ color:var(--accent,#c9a15a); }

  .swatches{ display:flex; gap:6px; margin-top:12px; flex-wrap:wrap; }
  .sw{ width:22px; height:22px; border-radius:7px; cursor:pointer; border:2px solid transparent; }
  .sw.active{ border-color:var(--navy); }
  .colorname{ font-size:10.5px; color:var(--muted); font-weight:700; margin-left:4px; align-self:center; }
</style>
</head>
<body>
<div class="wrap">
  <div class="intro">
    Conceito: fundo do herocard sempre <b>escuro (navy)</b> em toda visão — só a <b>cor da borda (e do
    detalhe/progresso)</b> muda por hierarquia, funcionando como identificador visual de "em qual
    papel eu estou". Clique nas bolinhas de cada cartão pra testar outra cor antes de decidir.
  </div>

  <div class="grid" id="grid"></div>
</div>

<script>
  const palette = [
    ["#c9a15a","dourado"], ["#f97316","laranja"], ["#0d9488","teal"],
    ["#2563eb","azul"], ["#84cc16","lima"], ["#9ca3af","prata"],
  ];

  const cards = [
    { who:"Colaborador — meta do dia (loja)", accent:"#c9a15a", lbl:"Meta em jogo — Super Meta", val:"R$ 1.240", sub:"de R$ 2.000 hoje", pct:62, footL:"62% concluído", footR:"Prêmio: R$ 150" },
    { who:"Colaborador — aba Online", accent:"#f97316", lbl:"Meta online do mês", val:"R$ 3.480", sub:"de R$ 5.000", pct:70, footL:"70% concluído", footR:"Prêmio: R$ 200" },
    { who:"Gerente — meta da equipe", accent:"#0d9488", lbl:"Meta em jogo — equipe", val:"R$ 61.200", sub:"de R$ 80.000", pct:76, footL:"76% concluído", footR:"Comissão: R$ 2.940" },
    { who:"Supervisor — visão multi-loja", accent:"#2563eb", lbl:"Meta em jogo — Loja 1", val:"R$ 214.500", sub:"de R$ 240.000", pct:89, footL:"89% concluído", footR:"3 lojas no escopo" },
    { who:"Sócio — visão da empresa", accent:"#84cc16", lbl:"Meta em jogo — Super Meta", val:"R$ 214.500", sub:"de R$ 240.000", pct:89, footL:"89% concluído", footR:"Comissão prevista: R$ 8.940" },
    { who:"Master Admin — painel geral", accent:"#9ca3af", lbl:"Faturamento do mês", val:"R$ 42.100", sub:"18 empresas ativas", pct:83, footL:"83% da meta interna", footR:"2 em atraso" },
  ];

  const grid = document.getElementById('grid');
  grid.innerHTML = cards.map((c, i) => `
    <div class="row">
      <div class="who">${c.who}</div>
      <div class="hero" id="hero-${i}" style="--accent:${c.accent}; --pct:${c.pct}%;">
        <div class="lbl">${c.lbl}</div>
        <div class="val">${c.val}</div>
        <div class="sub">${c.sub}</div>
        <div class="track"><div class="fill"></div></div>
        <div class="foot"><span>${c.footL}</span><b>${c.footR}</b></div>
      </div>
      <div class="swatches" id="sw-${i}"></div>
    </div>
  `).join('');

  cards.forEach((c, i) => {
    const sw = document.getElementById(`sw-${i}`);
    sw.innerHTML = palette.map(([hex,name]) =>
      `<div class="sw ${hex===c.accent?'active':''}" style="background:${hex}" data-hex="${hex}" title="${name}"></div>`
    ).join('') + `<span class="colorname" id="cn-${i}">${palette.find(p=>p[0]===c.accent)?.[1]||''}</span>`;

    sw.addEventListener('click', (e) => {
      const el = e.target.closest('.sw'); if(!el) return;
      const hex = el.dataset.hex;
      document.getElementById(`hero-${i}`).style.setProperty('--accent', hex);
      [...sw.querySelectorAll('.sw')].forEach(s => s.classList.toggle('active', s===el));
      document.getElementById(`cn-${i}`).textContent = palette.find(p=>p[0]===hex)?.[1] || '';
    });
  });
</script>
</body>
</html>
